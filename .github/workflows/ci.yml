name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iag
          POSTGRES_PASSWORD: iag_dev
          POSTGRES_DB: iag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iag -d iag_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Create service schema
        env:
          PGPASSWORD: iag_dev
        run: psql -h localhost -U iag -d iag_platform -c 'CREATE SCHEMA IF NOT EXISTS procurement;'

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Point platform-go at vendored snapshot
        run: go mod edit -replace=github.com/alvor-technologies/iag-platform-go=$(pwd)/third_party/platform-go

      - name: go mod tidy
        run: go mod tidy

      - name: Build
        run: go build -v ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=procurement
          REDIS_URL: redis://localhost:6379/0

      - name: Test
        run: go test ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=procurement
          # The database-backed tests gate on TEST_DATABASE_URL, not DATABASE_URL.
          # Nothing set it, so six files — every test that exercises a write
          # against real Postgres — silently skipped on every run.
          #
          # What that cost: migration 027 retyped every id column to UUID while
          # fifteen Create* paths still inserted PREFIX-<hex>. The whole write
          # surface of the service was dead on any migrated database, and the
          # suite stayed green for months, because the tests that insert were
          # the ones not running. Two more tests had quietly gone stale behind
          # the same gate.
          #
          # The job already provisions Postgres and creates the schema. This is
          # the one line that makes it count.
          TEST_DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable&search_path=procurement
          REDIS_URL: redis://localhost:6379/0

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (standalone target)
        run: docker build --target standalone -t iag-procurement:ci .
